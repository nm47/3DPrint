[include macro_overrides.cfg]

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_DISPLAY_PAUSE_COLORS
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause macro zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x//2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSE_PARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                              ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=7200                                                       ; set timeout to 2 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|float %}                                          ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_DISPLAY_INITIAL_COLORS
        #INITIAL_RGB                                                                    ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE_PARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %}

[gcode_macro _FILAMENT_TEMPS]
description: Hotend temperatures for LOAD_FILAMENT / UNLOAD_FILAMENT TYPE=..., also shown in the LCD menu
variable_temps: {'PLA': 205, 'ABS': 240, 'ASA': 255}
gcode:

[gcode_macro _FILAMENT_HEAT]
description: Heat for a filament change: to TYPE's temp or TEMP if given, otherwise to 240 only if too cold to extrude
gcode:
    {% set temps = printer["gcode_macro _FILAMENT_TEMPS"].temps %}
    {% set type = params.TYPE|default("")|upper %}
    {% if type and type not in temps %}
        { action_raise_error("Unknown filament TYPE=%s (known: %s)" % (type, temps.keys()|join(", "))) }
    {% endif %}
    {% set temp = temps[type] if type else params.TEMP|default(0)|float %}
    {% if temp > 0 %}
        M109 S{temp}
    {% elif printer.extruder.target < printer.configfile.settings.extruder.min_extrude_temp %}
        M109 S240
    {% else %}
        C_TEMPERATURE_WAIT
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament. TYPE=PLA|ABS|ASA or TEMP=<C> heats first; the heater is left as it was found
gcode:
    {% set prev_target = printer.extruder.target %}
    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    _FILAMENT_HEAT {rawparams}
    M83                            ; set extruder to relative pos
    G1 E10 F500                    ; extrude a little to shape tip
    G1 E-80 F1800
    M400
    M104 S{prev_target}            ; put the heater back where we found it
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE

[gcode_macro LOAD_FILAMENT]
description: Load filament. TYPE=PLA|ABS|ASA or TEMP=<C> heats first; the heater is left as it was found
gcode:
    {% set prev_target = printer.extruder.target %}
    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
    _FILAMENT_HEAT {rawparams}
    M83                            ; set extruder to relative
    G1 E60 F500                    ; load
    G1 E20 F300                    ; prime nozzle with filament
    M400
    M104 S{prev_target}            ; put the heater back where we found it
    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE

[gcode_macro PURGE_LINE]
gcode:
    {% set y_purge_start = 5 %}
    {% set x_purge_start = 90 %}
    {% set x_purge_end = 150 %}

    C_TEMPERATURE_WAIT

    # Move to starting position
    G1 X{x_purge_start} Y{y_purge_start} F12000
    M83                                           ; Set extruder to relative mode
    G0 Z0.3                                       ; Set nozzle height
    M400                                          ; Wait for moves to complete

    # First purge line (left to right)
    G1 X{x_purge_start} E18 F750                  ; Prime the nozzle
    G1 X{x_purge_end} E25 F1000                   ; Draw first line

    # Move to second line position
    G0 Y{y_purge_start + 0.4} F5000               ; Move 0.4mm over

    # Second purge line (right to left)
    G1 X{x_purge_start} E25 F1000                 ; Draw second line back

    # Lift and retract
    G1 E-0.5 F1800                                ; Small retract
    G1 Z10 F3000                                  ; Lift nozzle

[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set wipe_count = 8 %}
    SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE
    G90
    G0 Z15 F300
    {% for wipe in range(wipe_count) %}
      {% for coordinate in [(200, 250),(225, 250)] %}
        G0 X{coordinate[0]} Y{coordinate[1] + 0.25 * wipe} Z0 F12000
      {% endfor %}
    {% endfor %}
    RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE

[gcode_macro SET_CASELIGHT]
variable_brightness: 1.0
# warm white on the RGB strip (R:G:B), scaled by brightness; keep in sync with initial_* on [neopixel caselight]
variable_color: [1.0, 0.7, 0.35]
gcode:
  {% if params.VALUE is defined %}
    {% set b = params.VALUE|float %}
    {% if b > 0 %}
      # remember a non-zero brightness for the next toggle
      SET_GCODE_VARIABLE MACRO=SET_CASELIGHT VARIABLE=brightness VALUE={b}
    {% endif %}
  {% elif printer["neopixel caselight"].color_data[0][:3]|sum > 0 %}
    # toggle: currently on, turn off
    {% set b = 0 %}
  {% else %}
    # toggle: currently off, turn on with saved brightness
    {% set b = brightness %}
  {% endif %}
  SET_LED LED=caselight RED={b * color[0]} GREEN={b * color[1]} BLUE={b * color[2]}

[gcode_macro SET_NOZZLE_LIGHT]
gcode:
    {% set VALUE = params.VALUE|default(1)|int %}
    SET_PIN PIN=nozzle_light_pin VALUE={VALUE}

[gcode_macro PRINT_START]
gcode:
    {% set hotend_temp = params.EXTRUDER|int %}
    {% set bed_temp = params.BED|int %}
    {% set chamber_temp = params.CHAMBER|default(55)|int %}
    {% set probe_temp = params.PROBE_TEMP|default(150)|int %}
    {% set z_offset = params.Z_OFFSET|default(0.0)|float %}

    M106 S10                       ; turn on fans so we don't melt ducts
    SET_NOZZLE_LIGHT VALUE=1
    
    M104 S{probe_temp}             ; non-blocking heat to probing temperature on hotend
    
    G92 E0                         ; zero the extruder
    M117 Heat Bed: {bed_temp}c
    M190 S{bed_temp}               ; wait for bed to heat to target temperature

    M117 Heat for Probe: {probe_temp}c
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={probe_temp-2} MAXIMUM={probe_temp+2} ; make sure we're actually at probing temp

    M117 TRAM BED
    C_G28 AXES=XYZ       ; conditionally home all
    Z_TILT_ADJUST        ; zeroes Z to the plane fitted through the tilt points
    G28 Z                ; re-zero exactly at the home point, which the mesh's zero reference uses

    M117 BED MESH
    BED_MESH_CALIBRATE PROBE_METHOD=proximity

    M117 Heat Hotend: {hotend_temp}c
    M109 S{hotend_temp}
    # M117 WIPE NOZZLE
    # CLEAN_NOZZLE

    SET_GCODE_OFFSET Z={z_offset}
    PURGE_LINE
    
    # Raise nozzle by 10mm
    G1 Z10 F3000
    M117 PRINTING..


[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set toolhead = printer.toolhead %}
    {% set x_safe = toolhead.position.x + 20 * (1 if toolhead.axis_maximum.x - toolhead.position.x > 20 else -1) %}
    {% set y_safe = toolhead.position.y + 20 * (1 if toolhead.axis_maximum.y - toolhead.position.y > 20 else -1) %}
    {% set z_safe = [toolhead.position.z + 2, toolhead.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    {% if printer.extruder.can_extrude %}
        G1 E-5.0 F1800             ; retract filament (skipped if the nozzle has cooled, e.g. cancel after a long pause)
    {% endif %}
    
    TURN_OFF_HEATERS
    SET_NOZZLE_LIGHT VALUE=0
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    M107                                     ; turn off fan
    G0 X{toolhead.axis_minimum.x} Y{toolhead.axis_maximum.y} F3600  ; park nozzle at rear
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END


# Park at center of build volume
[gcode_macro PARK_CENTER]
gcode:
    C_G28
    # Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    
    # Calculate center positions
    {% set center_x = max_x / 2 %}
    {% set center_y = max_y / 2 %}
    {% set center_z = max_z / 2 %}
    
    # Use center Z or current Z, whichever is higher (to avoid collision)
    {% set park_z = [printer.toolhead.position.z + 10, center_z]|max %}
    
    # Save current state
    SAVE_GCODE_STATE NAME=PARK_CENTER_STATE
    
    # Move to center
    G90                               # Absolute positioning
    G0 Z{park_z} F3000               # Move to center Z or stay high
    G0 X{center_x} Y{center_y} F6000 # Move to center XY
    
    # Restore state
    RESTORE_GCODE_STATE NAME=PARK_CENTER_STATE

