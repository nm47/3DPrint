##
## HEAT_SOAK TARGET=<chamber temp> [TIMEOUT=<minutes, default 20>] [SENSOR=<sensor, default "temperature_sensor chamber">]
##
## Pauses the print (plain pause: no park, no retract) until the chamber reaches TARGET or TIMEOUT
## runs out, then resumes it either way. RESUME or SKIP_HEAT_SOAK skips the rest of the soak,
## CANCEL_PRINT cancels as usual. Run outside a print it just waits and reports.
##

[gcode_macro HEAT_SOAK]
description: Pause the print until the chamber reaches TARGET (or TIMEOUT minutes pass), then resume
variable_active: False
variable_paused_print: False
variable_target: 0.0
variable_sensor: ''
variable_remaining: 0
gcode:
    {% set target = params.TARGET|default(0)|float %}
    {% set timeout = params.TIMEOUT|default(20)|float %}
    {% set sensor = params.SENSOR|default("temperature_sensor chamber") %}
    {% set temp = printer[sensor].temperature %}

    {% if target <= 0 %}
        { action_respond_info("Heat soak: no TARGET given, skipping") }
    {% elif temp >= target %}
        { action_respond_info("Heat soak: chamber already at %.1fC / %.1fC, skipping" % (temp, target)) }
    {% else %}
        {% set pause_print = printer.print_stats.state == "printing" %}
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=target VALUE={target}
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=sensor VALUE="'{sensor}'"
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=remaining VALUE={(timeout * 60)|int}
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=paused_print VALUE={pause_print}
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=active VALUE=True
        { action_respond_info("Heat soak: waiting for the chamber to reach %.1fC (now %.1fC), up to %d min. RESUME skips it." % (target, temp, timeout)) }
        M117 Soak {'%.1f/%.0fC' % (temp, target)}
        {% if pause_print %}
            BASE_PAUSE                     ; plain Klipper pause: the toolhead stays where it is
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_CHECK DURATION=1
    {% endif %}

[gcode_macro SKIP_HEAT_SOAK]
description: End the heat soak now and resume the print
gcode:
    {% if printer["gcode_macro HEAT_SOAK"].active %}
        { action_respond_info("Heat soak skipped") }
        _HEAT_SOAK_FINISH
    {% endif %}

[gcode_macro STOP_HEAT_SOAK]
description: End the heat soak without resuming (CANCEL_PRINT calls this)
gcode:
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=active VALUE=False
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_CHECK DURATION=0
    M117

[gcode_macro _HEAT_SOAK_FINISH]
gcode:
    {% set soak = printer["gcode_macro HEAT_SOAK"] %}
    STOP_HEAT_SOAK
    {% if soak.paused_print and printer.pause_resume.is_paused %}
        BASE_RESUME
    {% endif %}

[delayed_gcode _HEAT_SOAK_CHECK]
gcode:
    {% set soak = printer["gcode_macro HEAT_SOAK"] %}
    {% if soak.active %}
        {% set temp = printer[soak.sensor].temperature %}
        {% set remaining = soak.remaining - 5 %}
        {% if soak.paused_print and not printer.pause_resume.is_paused %}
            # the print was resumed or cancelled some other way
            STOP_HEAT_SOAK
        {% elif temp >= soak.target %}
            { action_respond_info("Heat soak done: chamber at %.1fC" % temp) }
            _HEAT_SOAK_FINISH
        {% elif remaining <= 0 %}
            { action_respond_info("Heat soak timed out at %.1fC / %.1fC, continuing anyway" % (temp, soak.target)) }
            _HEAT_SOAK_FINISH
        {% else %}
            SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=remaining VALUE={remaining}
            M117 Soak {'%.1f/%.0fC %dm' % (temp, soak.target, (remaining / 60)|round(0, 'ceil'))}
            {% if remaining % 60 == 0 %}
                { action_respond_info("Heat soak: chamber %.1fC / %.1fC, %d min left" % (temp, soak.target, remaining // 60)) }
            {% endif %}
            G4 P1                          ; keep idle_timeout from firing while paused
            UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_CHECK DURATION=5
        {% endif %}
    {% endif %}
