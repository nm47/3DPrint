[gcode_macro PURGE_LINE]
gcode:
    {% set y_purge_start = 4 %}
    {% set x_purge_start = 20 %}
    {% set x_purge_end = 100 %} 

    C_G28
    C_TEMPERATURE_WAIT
    G1 X{x_purge_start} Y{y_purge_start} F5000  ; Move the nozzle to the starting position
    G0 Z0.3                                      ; Raise the nozzle to 0.3mm height
    M400                                          ; Ensure all moves are complete before proceeding
    M83                                           ; Set extruder to relative mode
    G1 X{x_purge_start + 25} E10 F1000            ; Extrude 6mm of filament
    G1 X{x_purge_end} E8 F1000                   ; Extrude 8mm more while finishing the move
    G1 Z10 F3000
